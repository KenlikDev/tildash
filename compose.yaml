services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${TILDASH_DATABASE_NAME:-tildash}
      POSTGRES_USER: ${TILDASH_DATABASE_USERNAME:-tildash}
      POSTGRES_PASSWORD: ${TILDASH_DATABASE_PASSWORD:-tildash-dev}
    ports:
      - "${TILDASH_DATABASE_PORT:-5432}:5432"
    volumes:
      - tildash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  tildash-postgres-data:
